<body>

	<header>
		<img src="../images/pngegg.png" alt="Logo Clínica SaludTotal">
		<h1>Rutas Rapidas</h1>

	</header>

	<nav>

	<main>

		<section>

			<h2>Solicitar un nuevo ticket</h2>

			<form action="confirmacion.html">
				<p>
					<label for="Nombre y Apellido">Nombre y Apellido</label><br>
					<input type="text">
				</p>

					<label for="Categoria">Categoria</label><br>

						<option>Acceso a Sistemas</option>

					</select>
				</p>

				<p>
					<label for="Titulo">Titulo</label><br>
					<input type="text">
				</p>

				<p>
					<label for="Descripción">Descripcion</label><br>
					<input type="text">
				</p>

				<p>
					<input type="submit" value="Solicitar Ticket">
				</p>

			</form>

		</section>
