<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar sesión</title>
	<link rel="stylesheet" href="../css/styles.css">
	<script src="../js/scripts.js" defer></script>
</head>

<body>

	<header>
		<img src="../images/pngegg.png" alt="Logo TechSolve">
		<h1>Rutas Rapidas</h1>
		<p>Soporte tecnico TechSolve</p>
	</header>

	<nav>
		<ul>
			<li><a href="../index.html">Inicio</a></li>
			<li class="empleado"><a href="solicitar-ticket.html">Solicitar Ticket</a></li>
			<li class="empleado"><a href="mis-tickets.html">Mis Tickets</a></li>
			<li class="empleado"><a href="historial.html">Historial de Tickets</a></li>
			<li class="tecnico"><a href="panel-tecnico.html">Panel de Tickets</a></li>
			<li class="gerente"><a href="tablero.html">Tablero de Control</a></li>
			<li class="visitante"><a href="login.html">Iniciar sesión</a></li>
			<li class="empleado tecnico gerente"><span id="usuario-conectado"></span></li>
			<li class="empleado tecnico gerente"><a href="#" id="cerrar-sesion">Cerrar sesión</a></li>
		</ul>
	</nav>

	<main>
		<section>
			<h2>Iniciar sesión</h2>
			<form id="form-login">
				<p>
					<label for="email">Email corporativo</label><br>
					<input type="email" id="email" name="email" required>
				</p>
				<p>
					<label for="password">Contraseña</label><br>
					<input type="password" id="password" name="password" required>
				</p>
				<p>
					<input type="submit" value="Ingresar">
				</p>
				<p id="mensaje-login" class="mensaje-error"></p>
			</form>
		</section>

		<section>
			<h3>Usuarios de prueba (contraseña: 1234)</h3>
			<ul id="usuarios-demo"></ul>
		</section>
	</main>

	<footer>
		<p>© 2026 Soporte tecnico TechSolve</p>
	</footer>

</body>

</html>
