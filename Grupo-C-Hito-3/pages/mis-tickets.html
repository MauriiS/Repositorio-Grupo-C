<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mis tickets</title>
	<link rel="stylesheet" href="../css/styles.css">
	<script src="../js/scripts.js" defer></script>
</head>

<body>

	<header>
		<img src="../images/pngegg.png" alt="Logo TechSolve">
		<h1>Rutas Rapidas</h1>
		<p>Soporte tecnico TechSolve</p>
	</header>

	<nav>
		<ul>
			<li><a href="../index.html">Inicio</a></li>
			<li class="empleado"><a href="solicitar-ticket.html">Solicitar Ticket</a></li>
			<li class="empleado"><a href="mis-tickets.html">Mis Tickets</a></li>
			<li class="empleado"><a href="historial.html">Historial de Tickets</a></li>
			<li class="tecnico"><a href="panel-tecnico.html">Panel de Tickets</a></li>
			<li class="gerente"><a href="tablero.html">Tablero de Control</a></li>
			<li class="visitante"><a href="login.html">Iniciar sesión</a></li>
			<li class="empleado tecnico gerente"><span id="usuario-conectado"></span></li>
			<li class="empleado tecnico gerente"><a href="#" id="cerrar-sesion">Cerrar sesión</a></li>
		</ul>
	</nav>

	<main>
		<section>
			<h2>Mis Tickets</h2>
			<p id="sin-tickets" hidden>No tiene tickets activos.</p>
			<table id="tabla-mis-tickets"></table>
		</section>

		<section>
			<h2>Comentarios</h2>
			<div id="lista-comentarios"></div>
			<form id="form-comentario">
				<p>
					<label for="ticket-comentario">Ticket</label><br>
					<select id="ticket-comentario" name="ticket"></select>
				</p>
				<p>
					<label for="comment">Comentario</label><br>
					<textarea id="comment" name="comment" required></textarea>
				</p>
				<button type="submit">Enviar comentario</button>
			</form>
		</section>
	</main>

	<footer>
		<p>© 2026 Soporte tecnico TechSolve</p>
	</footer>

</body>

</html>
